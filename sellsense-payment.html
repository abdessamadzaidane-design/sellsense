<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SellSense — Free access</title>
<meta http-equiv="refresh" content="3; url=sellsense-dashboard.html"/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#FAFAF7;color:#0D1424;font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.55;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased;}
.box{max-width:480px;text-align:center;background:#fff;border:1px solid #EBE7DC;border-radius:20px;padding:48px 40px;box-shadow:0 24px 60px rgba(13,20,36,0.08);}
.logo{display:inline-flex;align-items:center;gap:10px;margin-bottom:28px;}
.lm{width:32px;height:32px;background:linear-gradient(135deg,#D4A53C,#E76F4A);border-radius:9px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(212,165,60,0.35);}
.ln{font-family:'Instrument Serif',Georgia,serif;font-size:22px;font-style:italic;letter-spacing:-0.5px;}
.gift{font-size:60px;margin-bottom:18px;display:block;}
h1{font-family:'Instrument Serif',Georgia,serif;font-size:38px;font-weight:400;letter-spacing:-0.8px;line-height:1.05;margin-bottom:12px;}
h1 em{color:#1E2761;}
p{font-size:14.5px;color:#6B7280;margin-bottom:22px;}
.btn{display:inline-flex;align-items:center;gap:7px;background:#0A0F1E;color:#fff;font-size:14px;font-weight:600;padding:12px 22px;border-radius:11px;text-decoration:none;}
.btn:hover{background:#1E2761;}
.rd{font-size:11.5px;color:#6B7280;margin-top:18px;}
.bar{height:3px;background:#EBE7DC;border-radius:2px;margin-top:14px;overflow:hidden;}
.bf{height:100%;background:linear-gradient(90deg,#E76F4A,#D4A53C);animation:fill 3s linear forwards;}
@keyframes fill{from{width:0}to{width:100%}}
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <div class="lm"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1L15 5V11L8 15L1 11V5L8 1Z" stroke="#0A0F1E" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 5L11 7V9L8 11L5 9V7L8 5Z" fill="#0A0F1E"/></svg></div>
    <span class="ln">SellSense</span>
  </div>
  <span class="gift">🎁</span>
  <h1>It's all <em>free.</em></h1>
  <p>No billing. No "Pro" gates. Unlimited products, full AI Decision Center, every chart and every report — open to everyone while we're still building.</p>
  <a href="sellsense-dashboard.html" class="btn">Open my dashboard <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 5l7 7-7 7"/></svg></a>
  <div class="rd">Redirecting in <strong>3 seconds</strong>…</div>
  <div class="bar"><div class="bf"></div></div>
</div>
</body>
</html>
